name: Build and Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: woongdream/ongodmatchu-be

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create deployment script
        run: |
          cat > deploy.sh << 'DEPLOY_EOF'
          #!/bin/bash
          set -e
          
          echo "=== Writing env file ==="
          sudo mkdir -p /opt/ongodmatchu
          sudo tee /opt/ongodmatchu/.env > /dev/null << ENV_EOF
          SPRING_PROFILES_ACTIVE=__SPRING_PROFILES_ACTIVE__
          DB_URL=__DB_URL__
          DB_USERNAME=__DB_USERNAME__
          DB_PASSWORD=__DB_PASSWORD__
          JWT_SECRET=__JWT_SECRET__
          MAIL_USERNAME=__MAIL_USERNAME__
          MAIL_PASSWORD=__MAIL_PASSWORD__
          AWS_ACCESS_KEY=__AWS_ACCESS_KEY__
          AWS_SECRET_KEY=__AWS_SECRET_KEY__
          AWS_S3_BUCKET=__AWS_S3_BUCKET__
          CLAUDE_API_KEY=__CLAUDE_API_KEY__
          FRONTEND_URL=__FRONTEND_URL__
          GOOGLE_CLIENT_ID=__GOOGLE_CLIENT_ID__
          GOOGLE_CLIENT_SECRET=__GOOGLE_CLIENT_SECRET__
          NAVER_CLIENT_ID=__NAVER_CLIENT_ID__
          NAVER_CLIENT_SECRET=__NAVER_CLIENT_SECRET__
          KAKAO_CLIENT_ID=__KAKAO_CLIENT_ID__
          KAKAO_CLIENT_SECRET=__KAKAO_CLIENT_SECRET__
          ENV_EOF
          sudo chmod 600 /opt/ongodmatchu/.env
          
          echo "=== Pulling latest image ==="
          sudo docker pull ghcr.io/woongdream/ongodmatchu-be:latest
          
          echo "=== Stopping existing container ==="
          sudo docker stop ongodmatchu-backend 2>/dev/null || true
          sudo docker rm ongodmatchu-backend 2>/dev/null || true
          
          echo "=== Starting new container ==="
          sudo docker run -d \
            --name ongodmatchu-backend \
            --restart unless-stopped \
            --network host \
            --memory=512m \
            --memory-swap=1024m \
            --env-file /opt/ongodmatchu/.env \
            ghcr.io/woongdream/ongodmatchu-be:latest
          
          echo "=== Cleanup old images ==="
          sudo docker image prune -f
          
          echo "=== Done ==="
          DEPLOY_EOF
          
          # 환경변수 치환
          sed -i "s|__SPRING_PROFILES_ACTIVE__|${{ secrets.SPRING_PROFILES_ACTIVE }}|g" deploy.sh
          sed -i "s|__DB_URL__|${{ secrets.DB_URL }}|g" deploy.sh
          sed -i "s|__DB_USERNAME__|${{ secrets.DB_USERNAME }}|g" deploy.sh
          sed -i "s|__DB_PASSWORD__|${{ secrets.DB_PASSWORD }}|g" deploy.sh
          sed -i "s|__JWT_SECRET__|${{ secrets.JWT_SECRET }}|g" deploy.sh
          sed -i "s|__MAIL_USERNAME__|${{ secrets.MAIL_USERNAME }}|g" deploy.sh
          sed -i "s|__MAIL_PASSWORD__|${{ secrets.MAIL_PASSWORD }}|g" deploy.sh
          sed -i "s|__AWS_ACCESS_KEY__|${{ secrets.AWS_ACCESS_KEY }}|g" deploy.sh
          sed -i "s|__AWS_SECRET_KEY__|${{ secrets.AWS_SECRET_KEY }}|g" deploy.sh
          sed -i "s|__AWS_S3_BUCKET__|${{ secrets.AWS_S3_BUCKET }}|g" deploy.sh
          sed -i "s|__CLAUDE_API_KEY__|${{ secrets.CLAUDE_API_KEY }}|g" deploy.sh
          sed -i "s|__FRONTEND_URL__|${{ secrets.FRONTEND_URL }}|g" deploy.sh
          sed -i "s|__GOOGLE_CLIENT_ID__|${{ secrets.GOOGLE_CLIENT_ID }}|g" deploy.sh
          sed -i "s|__GOOGLE_CLIENT_SECRET__|${{ secrets.GOOGLE_CLIENT_SECRET }}|g" deploy.sh
          sed -i "s|__NAVER_CLIENT_ID__|${{ secrets.NAVER_CLIENT_ID }}|g" deploy.sh
          sed -i "s|__NAVER_CLIENT_SECRET__|${{ secrets.NAVER_CLIENT_SECRET }}|g" deploy.sh
          sed -i "s|__KAKAO_CLIENT_ID__|${{ secrets.KAKAO_CLIENT_ID }}|g" deploy.sh
          sed -i "s|__KAKAO_CLIENT_SECRET__|${{ secrets.KAKAO_CLIENT_SECRET }}|g" deploy.sh

      - name: Send command to EC2 via SSM
        run: |
          # 스크립트를 base64로 인코딩 (특수문자 문제 회피)
          ENCODED_SCRIPT=$(base64 -w 0 deploy.sh)
          
          # SSM 명령 실행
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ongodmatchu backend - ${{ github.sha }}" \
            --parameters "commands=[\"echo $ENCODED_SCRIPT | base64 -d > /tmp/deploy.sh && chmod +x /tmp/deploy.sh && /tmp/deploy.sh\"]" \
            --output text \
            --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: Wait for command to finish
        run: |
          echo "Waiting for deployment to finish..."
          
          # 최대 5분 대기
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ env.COMMAND_ID }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
          
            echo "Status: $STATUS (attempt $i/30)"
          
            if [ "$STATUS" = "Success" ]; then
              echo "✅ Command succeeded"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Command failed with status: $STATUS"
              break
            fi
          
            sleep 10
          done
          
          # 결과 출력
          echo "=== Command output ==="
          aws ssm get-command-invocation \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
          
          echo "=== Command errors (if any) ==="
          aws ssm get-command-invocation \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text
          
          # 최종 상태 확인
          FINAL_STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)
          
          if [ "$FINAL_STATUS" != "Success" ]; then
            exit 1
          fi

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 30
          
          for i in {1..15}; do
            echo "Attempt $i/15..."
            if curl -fsSL https://api.ongodmatchu.com/api/health; then
              echo ""
              echo "✅ Deployment successful!"
              exit 0
            fi
            sleep 10
          done
          
          echo "❌ Health check failed"
          exit 1