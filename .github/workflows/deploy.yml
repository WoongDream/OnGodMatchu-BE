name: Build and Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: woongdream/ongodmatchu-be

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ongodmatchu backend - ${{ github.sha }}" \
            --parameters '{
              "commands": [
                "set -e",
                "echo \"=== Pulling latest image ===\"",
                "sudo docker pull ghcr.io/woongdream/ongodmatchu-be:latest",
                "echo \"=== Stopping existing container ===\"",
                "sudo docker stop ongodmatchu-backend 2>/dev/null || true",
                "sudo docker rm ongodmatchu-backend 2>/dev/null || true",
                "echo \"=== Starting new container ===\"",
                "sudo docker run -d \\",
                "  --name ongodmatchu-backend \\",
                "  --restart unless-stopped \\",
                "  --network host \\",
                "  --memory=512m \\",
                "  --memory-swap=1024m \\",
                "  -e SPRING_PROFILES_ACTIVE='\"'\"'${{ secrets.SPRING_PROFILES_ACTIVE }}'\"'\"' \\",
                "  -e DB_URL='\"'\"'${{ secrets.DB_URL }}'\"'\"' \\",
                "  -e DB_USERNAME='\"'\"'${{ secrets.DB_USERNAME }}'\"'\"' \\",
                "  -e DB_PASSWORD='\"'\"'${{ secrets.DB_PASSWORD }}'\"'\"' \\",
                "  -e JWT_SECRET='\"'\"'${{ secrets.JWT_SECRET }}'\"'\"' \\",
                "  -e MAIL_USERNAME='\"'\"'${{ secrets.MAIL_USERNAME }}'\"'\"' \\",
                "  -e MAIL_PASSWORD='\"'\"'${{ secrets.MAIL_PASSWORD }}'\"'\"' \\",
                "  -e AWS_ACCESS_KEY='\"'\"'${{ secrets.AWS_ACCESS_KEY }}'\"'\"' \\",
                "  -e AWS_SECRET_KEY='\"'\"'${{ secrets.AWS_SECRET_KEY }}'\"'\"' \\",
                "  -e AWS_S3_BUCKET='\"'\"'${{ secrets.AWS_S3_BUCKET }}'\"'\"' \\",
                "  -e CLAUDE_API_KEY='\"'\"'${{ secrets.CLAUDE_API_KEY }}'\"'\"' \\",
                "  -e FRONTEND_URL='\"'\"'${{ secrets.FRONTEND_URL }}'\"'\"' \\",
                "  -e GOOGLE_CLIENT_ID='\"'\"'${{ secrets.GOOGLE_CLIENT_ID }}'\"'\"' \\",
                "  -e GOOGLE_CLIENT_SECRET='\"'\"'${{ secrets.GOOGLE_CLIENT_SECRET }}'\"'\"' \\",
                "  -e NAVER_CLIENT_ID='\"'\"'${{ secrets.NAVER_CLIENT_ID }}'\"'\"' \\",
                "  -e NAVER_CLIENT_SECRET='\"'\"'${{ secrets.NAVER_CLIENT_SECRET }}'\"'\"' \\",
                "  -e KAKAO_CLIENT_ID='\"'\"'${{ secrets.KAKAO_CLIENT_ID }}'\"'\"' \\",
                "  -e KAKAO_CLIENT_SECRET='\"'\"'${{ secrets.KAKAO_CLIENT_SECRET }}'\"'\"' \\",
                "  ghcr.io/woongdream/ongodmatchu-be:latest",
                "echo \"=== Cleanup old images ===\"",
                "sudo docker image prune -f",
                "echo \"=== Done ===\""
              ]
            }' \
            --output text \
            --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          
          # 명령 완료 대기
          echo "Waiting for deployment to finish..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
          
          # 결과 출력
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output table

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 30
          
          for i in {1..10}; do
            echo "Attempt $i..."
            if curl -fsSL https://api.ongodmatchu.com/api/health; then
              echo ""
              echo "✅ Deployment successful!"
              exit 0
            fi
            sleep 10
          done
          
          echo "❌ Health check failed"
          exit 1경